<nav aria-label="Page navigation" class="mt-8 flex flex-col items-center gap-4">
  
  <ul #verTodo [attr.data-expanded]="false" 
      class="grid grid-cols-5 sm:grid-cols-10 gap-2 list-none p-0 transition-all duration-500">
    
    <li *ngFor="let item of (verTodo.getAttribute('data-expanded') === 'true' ? numberPags : numberPags.slice(0, 10))">
      <a class="flex items-center justify-center w-10 h-10 md:w-12 md:h-12 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-md transition-all active:scale-90 text-lg" 
         href="javascript:void(0)" 
         (click)="cambiarPagina(item)">
        {{ item }}
      </a>
    </li>

  </ul>

  <button *ngIf="numberPags.length > 10"
    type="button"
    (click)="verTodo.getAttribute('data-expanded') === 'false' ? verTodo.setAttribute('data-expanded', 'true') : verTodo.setAttribute('data-expanded', 'false')"
    class="flex items-center gap-2 px-6 py-2 bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold rounded-full border border-slate-700 shadow-lg transition-all text-sm uppercase tracking-widest">
    
    <span *ngIf="verTodo.getAttribute('data-expanded') === 'false'">
      <i class="fa fa-plus-circle"></i> Ver más páginas ({{ numberPags.length - 10 }}+)
    </span>
    
    <span *ngIf="verTodo.getAttribute('data-expanded') === 'true'">
      <i class="fa fa-minus-circle"></i> Ver menos
    </span>

  </button>
</nav>
