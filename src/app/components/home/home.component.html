<div class="video-background">
  <video autoplay muted loop playsinline [attr.src]="videoSrc"></video>
</div>

<div class="home-container text-center">
  <div class="contenido-central container-lg bg-white bg-opacity-50 p-3 p-md-5 rounded shadow-lg mx-auto">

    <!-- Logo -->
    <img src="../../../assets/img/logo.png" class="img-fluid mb-3 mx-auto d-block logo" alt="Logo">

    <!-- Título -->
    <h1 class="titulo-principal text-success text-center mb-2 mb-md-4">
      Eventos deportivos <br>
      <span class="titulo-secundario">Soccer Melgar</span>
    </h1>

    <!-- Cards -->
    <div class="row g-4 justify-content-center">
      
      <!-- Card 1 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 d-flex flex-column shadow border-0 rounded-4">
          <img src="../../../assets/img/img2.jpg" class="card-img-top img-fluid rounded-top-4" alt="...">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-success">Inscribir Jugador</h5>
            <p class="card-text">Inscríbete como jugador en nuestra plataforma.</p>
            <button (click)="Inscribete(1)" class="btn btn-success mt-auto btn-change-success">
              <i class="fa fa-edit"></i> Inscríbete
            </button>
          </div>
        </div>
      </div>


        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 d-flex flex-column shadow border-0 rounded-4">
          <img src="../../../assets/img/equipoF.jpg" class="card-img-top img-fluid rounded-top-4" alt="...">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-success">Inscribir Club</h5>
            <p class="card-text">Inscríbete como club en nuestra plataforma.</p>
            <button (click)="Inscribete(2)" class="btn btn-success mt-auto btn-change-success">
              <i class="fa fa-edit"></i> Inscríbete
            </button>
          </div>
        </div>
      </div>


      <!-- Card 2 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 d-flex flex-column shadow border-0 rounded-4">
          <img src="../../../assets/img/img3.jpg" class="card-img-top img-fluid rounded-top-4" alt="...">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-success">Ver próximos Torneos</h5>
            <p class="card-text">Busca próximos torneos.</p>
            <button (click)="torneos()" class="btn btn-success mt-auto btn-change-success">Más info</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 d-flex flex-column shadow border-0 rounded-4">
          <img src="../../../assets/img/admin.jpg" class="card-img-top img-fluid rounded-top-4" alt="...">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-success">Zona Administrativa</h5>
            <p class="card-text">Ingresa a la zona administrativa</p>
            <button (click)="admin()" class="btn btn-success mt-auto btn-change-success">
              <i class="fa fa-edit"></i> Ingresa
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
