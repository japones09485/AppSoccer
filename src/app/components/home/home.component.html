<div class="fixed inset-0 -z-10 overflow-hidden">
  <video autoplay muted loop playsinline [attr.src]="videoSrc" 
    class="absolute min-w-full min-h-full object-cover">
  </video>
  <div class="absolute inset-0 bg-gradient-to-br from-slate-950/80 via-slate-900/40 to-slate-950/80 backdrop-blur-[4px]"></div>
</div>

<div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-5xl bg-white/[0.08] backdrop-blur-2xl rounded-[2.5rem] shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)] border border-white/20 p-6 sm:p-10 animate-in fade-in zoom-in duration-1000 relative overflow-hidden">
    
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/20 blur-[100px] rounded-full"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-sky-500/20 blur-[100px] rounded-full"></div>

    <header class="mb-10 text-center relative z-10">
      <div class="relative inline-block mb-4 group">
        <img src="../../../assets/img/logo.png" class="w-16 sm:w-20 mx-auto drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] transition-transform duration-500 group-hover:scale-110" alt="Logo">
      </div>
      <div class="space-y-1">
        <h1 class="text-2xl sm:text-4xl font-extralight text-white tracking-tight">
          EVENTOS <span class="font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-emerald-200">SOCCER MELGAR</span>
        </h1>
        <div class="flex items-center justify-center gap-4">
          <span class="h-[1px] w-12 bg-gradient-to-r from-transparent to-emerald-500/50"></span>
          <p class="text-[10px] sm:text-xs font-bold uppercase tracking-[0.4em] text-emerald-400/80">
            Elite Management System
          </p>
          <span class="h-[1px] w-12 bg-gradient-to-l from-transparent to-emerald-500/50"></span>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 relative z-10">
      
      <div class="group cursor-pointer" (click)="Inscribete(1)">
        <div class="relative aspect-[16/10] sm:aspect-[4/5] overflow-hidden rounded-3xl border border-white/10 bg-slate-900/20 transition-all duration-500 hover:border-emerald-500/50 hover:shadow-[0_0_30px_-5px_rgba(16,185,129,0.3)] hover:-translate-y-2">
          <img src="../../../assets/img/img2.jpg" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-all duration-700 group-hover:scale-110" alt="Jugador">
          
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-90"></div>
          
          <div class="absolute bottom-5 left-5 right-5">
            <div class="flex items-center gap-2 mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-[9px] font-black text-emerald-400 uppercase tracking-[0.2em]">Live Registration</p>
            </div>
            <h5 class="text-base font-bold text-white tracking-wide group-hover:text-emerald-300 transition-colors">Inscribir Jugador</h5>
          </div>
        </div>
      </div>

      <div class="group cursor-pointer" (click)="torneos()">
        <div class="relative aspect-[16/10] sm:aspect-[4/5] overflow-hidden rounded-3xl border border-white/10 bg-slate-900/20 transition-all duration-500 hover:border-emerald-500/50 hover:shadow-[0_0_30px_-5px_rgba(16,185,129,0.3)] hover:-translate-y-2">
          <img src="../../../assets/img/img3.jpg" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-all duration-700 group-hover:scale-110" alt="Torneos">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-90"></div>
          <div class="absolute bottom-5 left-5 right-5">
            <p class="text-[9px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-1">Match Day</p>
            <h5 class="text-base font-bold text-white tracking-wide group-hover:text-emerald-300 transition-colors">Próximos Torneos</h5>
          </div>
        </div>
      </div>

      <div class="group cursor-pointer" (click)="admin()">
        <div class="relative aspect-[16/10] sm:aspect-[4/5] overflow-hidden rounded-3xl border border-white/10 bg-slate-900/20 transition-all duration-500 hover:border-emerald-500/50 hover:shadow-[0_0_30px_-5px_rgba(16,185,129,0.3)] hover:-translate-y-2">
          <img src="../../../assets/img/admin.jpg" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-all duration-700 group-hover:scale-110" alt="Admin">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-90"></div>
          <div class="absolute bottom-5 left-5 right-5">
            <p class="text-[9px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-1">Staff Only</p>
            <h5 class="text-base font-bold text-white tracking-wide group-hover:text-emerald-300 transition-colors">Administración</h5>
          </div>
        </div>
      </div>

      <div class="group cursor-pointer" (click)="abrirYDescargarPdf()">
        <div class="relative aspect-[16/10] sm:aspect-[4/5] overflow-hidden rounded-3xl border border-white/10 bg-slate-900/20 transition-all duration-500 hover:border-emerald-500/50 hover:shadow-[0_0_30px_-5px_rgba(16,185,129,0.3)] hover:-translate-y-2">
          <img src="../../../assets/img/doc.jpg" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-all duration-700 group-hover:scale-110" alt="Docs">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-90"></div>
          <div class="absolute bottom-5 left-5 right-5">
            <p class="text-[9px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-1">Resources</p>
            <h5 class="text-base font-bold text-white tracking-wide group-hover:text-emerald-300 transition-colors">Documentación</h5>
          </div>
        </div>
      </div>

    </div>

    <footer class="mt-10 pt-6 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4 text-[9px] font-bold uppercase tracking-[0.3em] text-slate-400 relative z-10">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span>System Status: Online</span>
      </div>
      <div class="flex gap-6 text-sm">
        <i class="fa fa-instagram hover:text-white transition-all cursor-pointer"></i>
        <i class="fa fa-facebook hover:text-white transition-all cursor-pointer"></i>
        <i class="fa fa-twitter hover:text-white transition-all cursor-pointer"></i>
      </div>
      <span class="opacity-50">© 2026 Soccer Melgar Elite</span>
    </footer>

  </div>
</div>
