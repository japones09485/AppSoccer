<div class="min-h-screen bg-zinc-50 dark:bg-[#09090b]">

  <!-- NAV -->
  <header class="bg-white dark:bg-[#111113] border-b border-zinc-200 dark:border-[#27272a] px-6 py-3 flex items-center gap-4 sticky top-0 z-30">
    <button (click)="volver()"
      class="w-9 h-9 rounded-xl border border-zinc-200 dark:border-[#303038] flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:border-zinc-400 transition-colors">
      <i class="fa fa-arrow-left text-sm"></i>
    </button>
    <div class="w-px h-5 bg-zinc-200 dark:bg-zinc-700"></div>
    <div class="flex-1 min-w-0">
      <p class="text-[10px] font-black uppercase tracking-widest text-green-600 dark:text-green-400 leading-none mb-0.5">Formularios de Inscripción</p>
      <p class="text-sm font-bold text-zinc-900 dark:text-white truncate leading-none">Editor de formulario</p>
    </div>
    <div class="flex items-center gap-1.5 bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 rounded-full px-3 py-1">
      <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
      <span class="text-[10px] font-black uppercase tracking-wider text-green-700 dark:text-green-400">Editor</span>
    </div>
  </header>

  <div *ngIf="idFormulario">
    <app-form-builder [idFormulario]="idFormulario"></app-form-builder>
  </div>

</div>
